server:
  address: 127.0.0.1
  port: 8080
management:
  server:
    address: 127.0.0.1
    port: 8081
spring:
  datasource:
    url: ${FOS_DB_URL:jdbc:postgresql://localhost:5432/fos}
    username: ${FOS_DB_USER:fos}
    password: ${FOS_DB_PASSWORD:${FOS_LOCAL_DB_PASSWORD:}}
  flyway:
    enabled: true
    user: ${FOS_MIGRATION_USER:${FOS_DB_USER:fos}}
    password: ${FOS_MIGRATION_PASSWORD:${FOS_DB_PASSWORD:${FOS_LOCAL_DB_PASSWORD:}}}
fos:
  production: false
  dev-auth: true
  local-password: ${FOS_LOCAL_PASSWORD:}
  principals:
    tos-local: TOS
    fms-local: FMS
  allowed-hosts: [localhost,127.0.0.1]
  workers:
    enabled: true
  kafka:
    enabled: true
  targets:
    vehicle-job:
      url: http://localhost:8090/vehicle-job
      idempotency-confirmed: true
    vehicle-login-logout:
      url: http://localhost:8090/vehicle-login-logout
      idempotency-confirmed: true
    vehicle-yard-event:
      url: http://localhost:8090/vehicle-yard-event
      idempotency-confirmed: true
    vehicle-operation-status:
      url: http://localhost:8090/vehicle-operation-status
      idempotency-confirmed: true

  admin:
    enabled: true
    username: ${FOS_ADMIN_USER:admin}
    # Local login uses FOS_LOCAL_PASSWORD unless explicitly overridden here.
    password-hash: ${FOS_LOCAL_ADMIN_PASSWORD_HASH:}
  simulator:
    available: true
    real-fms-allowed-hosts: ${FOS_SIMULATOR_FMS_HOSTS:localhost,127.0.0.1}
    real-fms-bearer-token: ${FOS_SIMULATOR_FMS_TOKEN:}
    password: ${FOS_LOCAL_PASSWORD:}
    api-base-url: http://127.0.0.1:8080
    port: 8090
  uitv:
    available: false
