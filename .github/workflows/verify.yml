name: Verify FOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/bom.json
            target/bom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: fos-integration
          path: target/fos-integration-0.1.0.jar
