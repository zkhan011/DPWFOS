# Development dependencies only. Application runs on the host via ./mvnw spring-boot:run.
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: fos
      POSTGRES_USER: fos
      POSTGRES_PASSWORD: ${FOS_LOCAL_DB_PASSWORD:?Set a local database password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["fos-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fos -d fos"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.0
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  topics:
    image: apache/kafka:3.9.0
    depends_on: [kafka]
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list; do sleep 2; done
        for topic in fos.fms.vehicle-yard-event.v1 fos.fms.vehicle-operation-status.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$topic" --partitions 6 --replication-factor 1 --config retention.ms=259200000
        done
  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: ${UITV_RABBIT_USER:-fos-demo}
      RABBITMQ_DEFAULT_PASS: ${UITV_RABBIT_PASSWORD:-}
    profiles: [uitv]
    volumes: ["fos-rabbit:/var/lib/rabbitmq"]
volumes:
  fos-rabbit:
  fos-db:
